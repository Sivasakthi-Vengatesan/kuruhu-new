server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: pramaan-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pramaan}
    username: ${DATABASE_USERNAME:pramaan}
    password: ${DATABASE_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Security & JWT Configuration
app:
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# AI & LLM Provider Configuration
ai:
  provider: ${AI_PROVIDER:openai-compatible} # options: openai-compatible, groq, ollama, mock
  llm:
    base-url: ${LLM_BASE_URL:https://api.groq.com/openai/v1}
    api-key: ${LLM_API_KEY:}
    model-name: ${LLM_MODEL:llama-3.3-70b-versatile}
    temperature: ${LLM_TEMPERATURE:0.3}
    max-tokens: ${LLM_MAX_TOKENS:1024}
  embedding:
    provider: ${EMBEDDING_PROVIDER:internal} # options: internal, openai, ollama
    dimension: ${EMBEDDING_DIMENSION:384}
  tts:
    provider: ${TTS_PROVIDER:zoho} # options: zoho, none
    catalyst:
      client-id: ${CATALYST_CLIENT_ID:}
      client-secret: ${CATALYST_CLIENT_SECRET:}
      refresh-token: ${CATALYST_TTS_REFRESH_TOKEN:}
      org-id: ${CATALYST_ORG:60078981735}
      redirect-uri: ${CATALYST_REDIRECT_URI:http://www.zoho.com/catalyst}

# SpringDoc OpenAPI Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# Management & Health
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.pramaan: DEBUG
    org.springframework.security: INFO
