version: '3.8'

services:
  # -------------------------------------------------------------
  # PostgreSQL + pgvector Database
  # -------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pramaan-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pramaan_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pramaan_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # PRAMAAN Java Spring Boot 3 Backend
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: pramaan-backend-java
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/pramaan_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: password
      JWT_SECRET: 9a6e1a4d8c7b6f5e3d2c1b0a9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e
      JWT_EXPIRATION: 86400000
      LLM_PROVIDER: generic
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: llama3.2
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy

  # -------------------------------------------------------------
  # Next.js 16 + React 19 Frontend
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pramaan-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - backend

  # -------------------------------------------------------------
  # Optional: Local Ollama LLM & Embedding Service
  # -------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: pramaan-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data:
